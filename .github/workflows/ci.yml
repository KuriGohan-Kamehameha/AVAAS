name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Materialize and verify prompt corpus
        run: |
          python scripts/materialize_prompt_corpora.py --fetch
          python -m webui.prompts --write
          python -m webui.prompts --check
      - name: Compile and lint
        run: |
          python -m compileall -q webui scripts tests
          ruff check webui scripts tests
          node --check webui/static/capture-state.mjs
          node --check tests/browser/capture-state.test.mjs
      - name: Unit, adversarial, migration, backup, and browser tests
        run: |
          pytest -q -m "not container"
          node --test tests/browser/capture-state.test.mjs
      - name: Dependency audit
        run: pip-audit --requirement requirements.lock --disable-pip
      - name: Compose validation
        run: docker compose config >/dev/null

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Install locked smoke-test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Build and exercise non-root image
        env:
          AVAAS_RUN_CONTAINER_TESTS: "1"
        run: pytest -q -m container tests/test_container_smoke.py
